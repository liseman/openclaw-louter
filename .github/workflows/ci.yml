name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript tests
        run: npm test
      - name: Python syntax
        run: python -m py_compile scripts/*.py
      - name: Installer tests
        run: python test/installer_test.py
      - name: Package artifact audit
        run: |
          TGZ="$(npm pack --silent | tail -1)"
          tar -tzf "$TGZ" > /tmp/package-files.txt
          if grep -E '__pycache__|\.py[co]$|\.bak$|\.pre-' /tmp/package-files.txt; then
            echo "Forbidden generated/development file in npm package"
            exit 1
          fi
          tar -xOf "$TGZ" package/config.example.json > /tmp/config.example.json
          if grep -E '"endpoint"[[:space:]]*:[[:space:]]*"http://127\.0\.0\.1:' /tmp/config.example.json; then
            echo "Raw-IP example endpoint would trigger ClawHub install-source scanner"
            exit 1
          fi
