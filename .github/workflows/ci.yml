name: CI

on:
  push:
    branches-ignore: [community-stats]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript tests
        run: npm test
      - name: Python syntax
        run: python -m py_compile scripts/*.py
      - name: Installer tests
        run: python test/installer_test.py
      - name: Opt-in telemetry and aggregation tests
        run: python3 -B test/telemetry_test.py
      - name: Telemetry CLI stays local before consent
        run: |
          python3 -B scripts/louterctl.py telemetry --state-dir "$RUNNER_TEMP/unused-profile" status
          python3 -B scripts/louterctl.py telemetry --state-dir "$RUNNER_TEMP/unused-profile" preview
          python3 -B scripts/louterctl.py telemetry --state-dir "$RUNNER_TEMP/unused-profile" send
          test ! -e "$RUNNER_TEMP/unused-profile"
      - name: Extracted package creates no Python bytecode
        run: python3 -B test/no_bytecode_test.py
      - name: Package artifact audit
        run: |
          TGZ="$(npm pack --silent | tail -1)"
          tar -tzf "$TGZ" > /tmp/package-files.txt
          if grep -E '__pycache__|\.py[co]$|\.bak$|\.pre-' /tmp/package-files.txt; then
            echo "Forbidden generated/development file in npm package"
            exit 1
          fi
          tar -xOf "$TGZ" package/config.example.json > /tmp/config.example.json
          if grep -E '"endpoint"[[:space:]]*:[[:space:]]*"http://127\.0\.0\.1:' /tmp/config.example.json; then
            echo "Raw-IP example endpoint would trigger ClawHub install-source scanner"
            exit 1
          fi
