name: Community savings
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/community-stats.yml'
      - 'scripts/aggregate_telemetry.py'
      - 'scripts/telemetry_schema.py'
      - 'community/**'
permissions:
  contents: write
  issues: read
concurrency:
  group: louter-community-savings
  cancel-in-progress: false
jobs:
  aggregate:
    if: github.repository == 'liseman/openclaw-louter'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector and client
        run: python3 -B test/telemetry_test.py
      - name: Recompute from current issue snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/aggregate_telemetry.py --output "$RUNNER_TEMP/community"
      - name: Publish the dashboard branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          cd "$RUNNER_TEMP/community"
          git init --quiet --initial-branch=community-stats
          git remote add origin https://github.com/liseman/openclaw-louter.git
          git ls-remote --heads origin > "$RUNNER_TEMP/heads.txt"
          if grep -q 'refs/heads/community-stats$' "$RUNNER_TEMP/heads.txt"; then
            git fetch --quiet --depth=1 origin community-stats
            git reset --soft FETCH_HEAD
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md totals.json reports.json index.html .nojekyll
          if git diff --cached --quiet; then exit 0; fi
          git commit --quiet -m 'Refresh opt-in community savings'
          git push origin HEAD:refs/heads/community-stats
